@@include('../layout/_template-top.html')
<main class="account-page">
  <a class="account-page__back" href="index.html" aria-label="Go back">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m15 18-6-6 6-6"></path>
    </svg>
  </a>

  <section class="account-shell">
    <div class="account-card">
      <h1 class="account-card__title">Sign in</h1>

      <form class="account-form" action="#">
        <div class="account-form__fields">
          <div class="form-group">
            <input
              id="loginEmail"
              type="email"
              class="form--control account-form__control"
              placeholder="Email address">
          </div>

          <div class="form-group">
            <div class="input--group account-password">
              <input
                id="loginPassword"
                type="password"
                class="form--control account-form__control"
                placeholder="Password">
              <button
                type="button"
                class="password-show-hide account-password__toggle"
                aria-label="Show password">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a18.4 18.4 0 0 1-4.19 5.46"></path>
                  <path d="M6.61 6.61A18.18 18.18 0 0 0 2 12s3 7 10 7a10.45 10.45 0 0 0 5.38-1.52"></path>
                  <path d="M2 2l20 20"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <a class="account-card__forgot" href="javascript:void(0)">
          Forgot your password?
        </a>

        <div class="account-card__actions">
          <button type="submit" class="account-card__submit" disabled>
            Sign in
          </button>

          <button type="button" class="account-card__social" aria-label="Continue with Apple">
            <i class="fa-brands fa-apple"></i>
          </button>

          <button type="button" class="account-card__social" aria-label="Continue with Google">
            <i class="fa-brands fa-google"></i>
          </button>
        </div>

        <p class="account-card__legal">
          By signing in, you agree to our
          <a href="javascript:void(0)">Privacy Policy</a> and
          <a href="javascript:void(0)">User Agreement</a>.
        </p>
      </form>

      <a class="account-card__create" href="javascript:void(0)">
        Create an account
      </a>
    </div>
  </section>
</main>
@@include('../layout/_template-bottom.html')
